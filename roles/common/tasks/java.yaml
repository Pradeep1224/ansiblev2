- name: enable maven 3.9
  command: dnf module enable maven:3.9 -y 
- name: install maven and java25
  dnf:
    name:
    - maven
    - java-25-openjdk-devel 
    - maven-openjdk25 
    - mysql  # installing this so that we no need to set JAVA_HOME again
    state: present

- name: mvn version without JAVA_HOME
  command: mvn --version
  args:
    chdir: /app
  register: mvn_default

- name: print mvn version without JAVA_HOME
  debug:
    msg: "{{ mvn_default.stdout_lines }}"

- name: install dependencies
  command: mvn clean package
  args:
    chdir: /app
  # environment:
  #   JAVA_HOME: "{{ java25.stdout | dirname | dirname  }}"
- name: copying jar file to desired location
  command: mv target/{{component}}.jar {{component}}.jar
  args:
    chdir: /app

