- name: creating system user and make /app as home directory ----roboshop
  user:
    name: roboshop 
    create_home: false
    home: /app
    shell: /sbin/nologin
    comment: "roboshop system user"

- name: remove directory existing
  file:
    path: /app
    state: absent

- name: remove {{component}}.zip
  file:
    path: /tmp/{{component}}.zip
    state: absent
- name: create app directory
  file: 
    path: /app
    state: directory
- name: downloading file
  get_url:
    url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/{{component}}-v4.zip
    dest: /tmp/{{component}}.zip
- name: unzip
  unarchive: 
    src: /tmp/{{component}}.zip
    dest: /app
    remote_src: yes