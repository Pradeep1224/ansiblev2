- name: create ec2 instances and r53 records
  hosts: local
  connection: local
  vars:
  #ansible-playbook roboshop.yaml -e "instances=['mongodb','etc']"
    instances: ["mongodb", "redis", "mysql", "rabbitmq", "catalogue", "cart", "user", "shipping", "payment", "frontend"]
    action: create
    domain_name: pradeepverse.online
    ami_id: ami-0055977a6e828a4f4
  tasks:
  - name: create ec2 instances
    amazon.aws.ec2_instance:
      name: "roboshop-{{item}}"
      image_id: "{{ ami_id }}"
      instance_type: t3.micro
      security_groups:
      - "roboshop-common"
      - "roboshop-{{item}}"
      region: us-east-1
    loop: "{{instances}}"
    when: action == "create"
    register: ec2_output


  - name: print ec2 creation ec2_output
    debug:
      msg: "{{ec2_output}}"

  - name: create r53 record 
    amazon.aws.route53:
      state: present
      zone: "{{domain_name}}"
      record: "{{item.item}}.{{domain_name}}"
      type: A 
      ttl: 1
      value: "{{item.instances[0].private_ip_address}}"
      overwrite: true
    loop: "{{ec2_output.results}}"
    when: action == "create"





  - name: create r53 record 
    amazon.aws.route53:
      state: present
      zone: "{{domain_name}}"
      record: "{{domain_name}}" # frontend public ip 
      type: A 
      ttl: 1
      value: "{{item.instances[0].public_ip_address}}"
      overwrite: true
    loop: "{{ec2_output.results}}"
    when: action == "create" and item.item == "frontend"

  - name: delete r53 records
    amazon.aws.route53:
      state: absent
      zone: "{{domain_name}}"
      record: "{{item}}.{{domain_name}}"
      type: A 
      ttl: 1
    loop: "{{instances}}"
    when: action == "delete"




  - name: delete r53 records for frontend
    amazon.aws.route53:
      state: absent
      zone: "{{domain_name}}"
      record: "{{domain_name}}"
      type: A 
      ttl: 1
 
    when: action == "delete" 

  - name: delete ec2 instances
    amazon.aws.ec2_instance:
      state: "absent"
      name: "roboshop-{{item}}"
      region: us-east-1
      wait: false
    loop: "{{instances}}"
    when: action == "delete"


  